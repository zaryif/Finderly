name: finderly
description: "Cross-platform file organizer with macOS-style colored folders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  uuid: ^4.5.1
  open_file: ^3.5.10
  share_plus: ^10.1.2
  mime: ^1.0.6
  intl: ^0.19.0
  flutter_slidable: ^3.1.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/folders/
