name: finderly
description: "Cross-platform file organizer with macOS-style colored folders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1
  sqflite: ^2.3
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1
  file_picker: ^8.0
  uuid: ^4.4
  open_file: ^3.5
  share_plus: ^9.0
  mime: ^2.0
  intl: ^0.19
  flutter_slidable: ^3.1
  path: ^1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/folders/
